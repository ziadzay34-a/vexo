<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vexo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#000;color:#fff;overflow-x:hidden}

video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2));z-index:-1}

nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 40px;background:rgba(0,0,0,0.4);backdrop-filter:blur(15px);z-index:1000}
.logo{height:60px}

.menu{display:flex;gap:30px}
.menu a{text-decoration:none;color:#fff;font-weight:500;transition:.3s}
.menu a:hover{color:#f0b90b}

.buttons{display:flex;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:none;background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;transition:.3s}
.icon-btn:hover{transform:scale(1.1);background:#f0b90b;color:#000}

.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.hero h1{font-size:60px;font-weight:800;margin-bottom:10px}
.hero p{opacity:.8;margin-bottom:20px}
.hero-logo{
width:600px;
height:auto;
display:block;
margin:auto;
margin-bottom:20px;
}
.cta{padding:12px 30px;border:none;border-radius:8px;background:#f0b90b;font-weight:600;cursor:pointer;transition:.3s}
.cta:hover{transform:scale(1.1)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;padding:60px 40px;max-width:1200px;margin:auto}

.card{background:rgba(255,255,255,0.05);border-radius:20px;overflow:hidden;backdrop-filter:blur(10px);transition:.3s;text-align:center}
.card:hover{transform:translateY(-10px) scale(1.02)}

.card img{width:100%;height:160px;object-fit:cover}
.card h3{padding:15px}

.card a{display:block;text-decoration:none}

.card button{margin:0 15px 15px;padding:10px;width:calc(100% - 30px);border:none;border-radius:8px;background:#f0b90b;cursor:pointer;font-weight:bold}

footer{text-align:center;padding:30px;opacity:.6}.hero-logo{
width:600px;
height:auto;
display:block;
margin:auto;
margin-bottom:20px;
}
</style>
</head>

<body>
<video autoplay muted loop>
<source src="main vid.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<nav>
<img src="vexo_logo_transparent (2).png" class="logo">

<div class="menu">
<a href="index.html">Home</a>
<a href="more.html">More</a>
<a href="contact us.html">Contact</a>
</div>

<div class="buttons">
<button class="icon-btn" onclick="toggleTheme()">🌙</button>
<button class="icon-btn" onclick="toggleLang()">🌐</button>
<button class="icon-btn" onclick="searchSite()">🔍</button>
<button class="icon-btn" onclick="notify()">🔔</button>
<button class="icon-btn" onclick="help()">❓</button>
</div>
</nav>

<section class="hero">
<img src="vexo_logo_transparent (2).png" class="hero-logo">
<h1>Find Your Squad</h1>
<p id="desc">Lets connect with GAMERS</p>

</section>

<section class="cards">

<div class="card">
<img src="valo.jpg">
<h3>Valorant</h3>
<a href="valo.html"><button>Contact Players</button></a>
</div>

<div class="card">
<img src="Fortnite.webp">
<h3>Fortnite</h3>
<a href="fortnite.html"><button>Contact Players</button></a>
</div>

<div class="card">
<img src="pubg.webp">
<h3>PUBG</h3>
<a href="pubg.html"><button>Contact Players</button></a>
</div>

<div class="card">
<img src="over.jpg">
<h3>Overwatch</h3>
<a href="overwatch.html"><button>Contact Players</button></a>
</div>
<div class="card">
<img src="lol.jpg">
<h3>League Of Legends</h3>
<a href="lol.html"><button>Contact Players</button></a>
</div>
</section>

<footer>
<p>© Vexo 2026</p>
</footer>

<script>
function toggleTheme(){document.body.classList.toggle('light')}

let lang='en'
function toggleLang(){
lang = lang==='en' ? 'ar':'en'
document.body.dir = lang==='ar' ? 'rtl':'ltr'
}

function searchSite(){
let q = prompt('Search game...')
if(!q) return
q = q.toLowerCase()
document.querySelectorAll('.card').forEach(card=>{
let title = card.querySelector('h3').innerText.toLowerCase()
card.style.display = title.includes(q) ? 'block':'none'
})
}

function notify(){alert('No new notifications')}
function help(){alert('Help center coming soon')}
</script>

</body>
</html>
