<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vexo-overwatch 2-</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
    /* RESET */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body, html {
        height: 100%;
        width: 100%;
        font-family: 'Roboto', sans-serif;
        overflow-x: hidden;
    }

    /* الخلفية الصورة تغطي الشاشة */
    .full-screen-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('over 2.jpg') no-repeat center center;
        background-size: cover;
        z-index: -2; /* تحت كل العناصر */
    }

    /* الظل من تحت */
    .overlay {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 30%; /* ارتفاع الظل */
        background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0));
        pointer-events: none;
        z-index: -1;
    }

    /* NAVBAR ثابت وشفاف */
    nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 30px;
        background-color: rgba(31,31,31,0.7);
        backdrop-filter: blur(10px);
        z-index: 1000;
    }

    nav .logo {
        height: 50px;
    }

    nav .menu {
        display: flex;
        gap: 20px;
    }

    nav .menu a {
        text-decoration: none;
        color: #fff;
        font-weight: 500;
        position: relative;
        transition: color 0.3s;
    }

    nav .menu a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        background-color: #00d4ff;
        left: 0;
        bottom: -4px;
        transition: width 0.3s;
    }

    nav .menu a:hover::after {
        width: 100%;
    }

    nav .menu a:hover {
        color: #00d4ff;
    }

    nav .buttons {
        display: flex;
        gap: 10px;
    }

    .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 20px;
        transition: transform 0.2s, color 0.3s;
        color: #fff;
    }

    .icon-btn:hover {
        transform: scale(1.2);
        color: #00d4ff;
    }

    /* CENTRAL CONTENT */
    .center-content {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 20px;
        z-index: 10; /* فوق كل شيء */
        position: relative;
    }

    .center-content h1 {
        color: #ff0022;
        font-size: 48px;
        text-shadow: 0 2px 10px rgba(255, 0, 157, 0.6);
    }

    .center-btn {
        padding: 15px 40px;
        font-size: 22px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(45deg, #ff0000, #8000ff);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        text-decoration: none;
        display: inline-block;
    }

    .center-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }

    .center-btn::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.3);
        border-radius: 50%;
        transition: width 0.4s ease, height 0.4s ease;
    }

    .center-btn:active::after {
        width: 200px;
        height: 200px;
        transition: 0s;
    }

</style>
</head>
<body>

<!-- الخلفية -->
<div class="full-screen-bg"></div>
<div class="overlay"></div>

<!-- NAVBAR -->
<nav>
    <img class="logo" src="vexo_logo_transparent (2).png" alt="Vexo Logo">
    <div class="menu">
        <a href="index.html">home</a>
        <a href="https://facebook.com" target="_blank">contact us</a>
        <a href="more.html">more</a>
    </div>
    <div class="buttons">
        <button class="icon-btn" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="toggleLang()">🌐</button>
        <button class="icon-btn" onclick="searchSite()">🔍</button>
        <button class="icon-btn" onclick="notify()">🔔</button>
        <button class="icon-btn" onclick="help()">❓</button>
    </div>
</nav>

<!-- CENTRAL CONTENT -->
<div class="center-content">
    <h1>Overwatch 2</h1>
    <a class="center-btn" href="https://discord.com/channels/1488936809206649057/1488936810443964479">Connect To Players!</a>
    <h1 style="color: #fff; margin-top: 50px;">This button will convert you to Discord</h1>
</div>

<script>
    function toggleTheme() { alert("Toggle theme clicked!"); }
    function toggleLang() { alert("Toggle language clicked!"); }
    function searchSite() { alert("Search clicked!"); }
    function notify() { alert("Notifications clicked!"); }
    function help() { alert("Help clicked!"); }
</script>

</body>
</html>
